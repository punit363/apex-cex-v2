[package]
name = "engine_rust"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
ordered-float = { version = "5.5.0", features = ["serde"] }
redis = { version = "1.6.0", features = ["tokio-comp", "streams"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.0", features = ["v4", "fast-rng", "serde"] }

[dev-dependencies]
proptest = "1.11.0"
tokio-test = "0.4.5"
